[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qs-university-news"
version = "0.1.0"
description = "Discover official university news sources and incrementally collect articles."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "defusedxml>=0.7,<1",
  "trafilatura>=2.0,<3",
]

[project.scripts]
qs-news = "qs_news.cli:main"

[tool.setuptools.packages.find]
include = ["qs_news*"]

[tool.setuptools.package-data]
qs_news = ["data/*.json"]
